<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f69435">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <!-- <script src="js/main.js" defer></script> -->
    <!-- <script src="index.js" defer></script> -->
    <title>Document</title>
    <link rel="manifest" href="manifest.json" >
    <link rel="serviceWorker" href="serviceworker.js">
    <link rel="apple-touch-icon"  href="img/icon-192x192.png">
    <script>
        //サービスワーカーの登録
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('service-worker.js',{scope: './'})
          .then(function(reg){
            console.log('ServiceWorkerの登録成功 スコープ: ', reg.scope);
          }).catch(function(err){
            console.log('ServiceWorkerの登録失敗: ', err);
          });
        }
      </script>
</head>
<body>
    <header class="header" id="header">
        <nav class="nav container">
            <a href="#" class="nav__logo">Kashsan_jp_demo</a>

            <div class="nav__menu" id="nav-menu">
                <ul class="nav__list">
                    <li class="nav__item">
                        <a href="#home" class="nav__link active-link">
                            <i class='bx bx-home-alt nav__icon'></i>
                            <span class="nav__name">Home</span>
                        </a>
                    </li>

                    <li class="nav__item">
                        <a href="#about" class="nav__link">
                            <i class='bx bx-user nav__icon'></i>
                            <span class="nav__name">About</span>
                        </a>
                    </li>

                    <li class="nav__item">
                        <a href="#skills" class="nav__link">
                            <i class='bx bx-book-alt nav__icon'></i>
                            <span class="nav__name">Skills</span>
                        </a>
                    </li>

                    <li class="nav__item">
                        <a href="#portfolio" class="nav__link">
                            <i class='bx bx-briefcase-alt nav__icon'></i>
                            <span class="nav__name">Portfolio</span>
                        </a>
                    </li>

                    <li class="nav__item">
                        <a href="#contactme" class="nav__link">
                            <i class='bx bx-message-square-detail nav__icon'></i>
                            <span class="nav__name">Contactme</span>
                        </a>
                    </li>
                </ul>
            </div>

            <img src="img/post5 Small.jpeg" alt="" class="nav__img">
        </nav>
    </header>
    <main>
        <section class="container section section__height" id="home">
            <h2 class="section__title">Home</h2>
        </section>

        <section class="container section section__height" id="about">
            <h2 class="section__title">About</h2>
        </section>

        <section class="container section section__height" id="skills">
            <h2 class="section__title">Skills</h2>
        </section>

        <section class="container section section__height" id="portfolio">
            <h2 class="section__title">Portfolio</h2>
        </section>

        <section class="container section section__height" id="contactme">
            <h2 class="section__title">Contactme</h2>
        </section>
 
    </main>
    <div>
        
    </div>
</body>
